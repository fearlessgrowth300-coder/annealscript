[package]
name = "annealscript-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
z3 = { version = "0.21", features = ["gh-release"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "copy-dylibs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.27"

[build-dependencies]
# No code dependency -- this exists purely so Cargo sequences z3-sys's
# build script (which downloads libz3.dll) before ours (which stages it
# next to the exe). Without this, both build scripts can run concurrently
# and ours can finish scanning before the download completes.
z3-sys = { version = "0.13", features = ["gh-release"] }
